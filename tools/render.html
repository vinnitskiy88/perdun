<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><title>Пердун — рендер за еталоном</title>
<style>body{background:#111;color:#ddd;font:14px monospace;padding:16px}</style></head>
<body>
<h3>Рендер Пердуна за кривою обертів еталона (tools/out/&lt;car&gt;.track.json → &lt;car&gt;-perdun.wav)</h3>
<pre id="out">…</pre>
<script type="module">
// Примусово оновити модулі в HTTP-кеші (інакше браузер може взяти старі версії)
for (const f of ['cars.js', 'vehicle.js', 'engine-core.js', 'engine-worklet.js']) {
  await fetch('../js/' + f, { cache: 'reload' });
}
const { CARS } = await import('../js/cars.js');
const { Vehicle } = await import('../js/vehicle.js');

const SR = 48000, GAS_ON = 5.0, GAS_OFF = 13.0, STOP = 19.2, DT = 0.01;
const out = document.getElementById('out');
const log = (s) => { out.textContent += s + '\n'; };
out.textContent = '';

function interp(ts, vs, t) {
  if (t <= ts[0]) return vs[0];
  if (t >= ts[ts.length - 1]) return vs[vs.length - 1];
  let lo = 0, hi = ts.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (ts[m] <= t) lo = m; else hi = m; }
  const k = (t - ts[lo]) / (ts[hi] - ts[lo]);
  return vs[lo] + (vs[hi] - vs[lo]) * k;
}

function encodeWav(buf) {
  const n = buf.length, ch = buf.numberOfChannels, data = new DataView(new ArrayBuffer(44 + n * ch * 2));
  const w = (o, s) => [...s].forEach((c, i) => data.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); data.setUint32(4, 36 + n * ch * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  data.setUint32(16, 16, true); data.setUint16(20, 1, true); data.setUint16(22, ch, true);
  data.setUint32(24, SR, true); data.setUint32(28, SR * ch * 2, true); data.setUint16(32, ch * 2, true);
  data.setUint16(34, 16, true); w(36, 'data'); data.setUint32(40, n * ch * 2, true);
  const chans = [...Array(ch)].map((_, c) => buf.getChannelData(c));
  let o = 44;
  for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) {
    const v = Math.max(-1, Math.min(1, chans[c][i]));
    data.setInt16(o, v < 0 ? v * 32768 : v * 32767, true); o += 2;
  }
  return data.buffer;
}

async function renderCar(id) {
  const car = CARS.find((c) => c.id === id);
  const tr = await fetch(`out/${id}.track.json`).then((r) => r.json());
  const e = car.engine;
  const dur = STOP + 1.0;
  const ctx = new OfflineAudioContext(2, Math.ceil(SR * dur), SR);
  await ctx.audioWorklet.addModule('../js/engine-worklet.js');
  const node = new AudioWorkletNode(ctx, 'engine-processor', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
  node.port.postMessage({ type: 'car', engine: e });
  // та сама обробка, що в застосунку (app.js)
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -12; comp.knee.value = 8; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
  const master = ctx.createGain(); master.gain.value = 0.8;
  node.connect(comp).connect(master).connect(ctx.destination);
  master.gain.setTargetAtTime(0, STOP, 0.25);

  // моменти перемикань на газу: різке падіння обертів → коротка відсічка перед ним
  const drops = [];
  for (let i = 1; i < tr.t.length; i++) {
    if (tr.t[i] > GAS_ON && tr.t[i] < GAS_OFF && tr.rpm[i] < tr.rpm[i - 1] - 400) drops.push(tr.t[i]);
  }
  const v = new Vehicle(car); v.start();
  const P = ['rpm', 'load', 'overrun', 'cut', 'crank'].map((k) => node.parameters.get(k));
  for (let t = 0; t < dur; t += DT) {
    let rpm, load = 0, ov = 0, cut = 0, crank = 0;
    if (t < 2.6) {                       // наш запуск двигуна
      v.update(DT, 'test', { gas: 0, brake: 0 });
      rpm = v.rpm; load = v.load; crank = v.crank;
    } else {
      rpm = interp(tr.t, tr.rpm, t);
      if (t < GAS_ON) load = 0.2 * Math.max(0, Math.min(1, 1 - (rpm - e.idle) / 1500));
      else if (t < GAS_OFF) { load = 1; cut = drops.some((d) => t > d - 0.08 && t < d + 0.04) ? 1 : 0; }
      else if (t < STOP) { load = 0; ov = rpm > e.idle * 1.35 ? 1 : 0; }
      else { rpm = rpm * Math.exp(-(t - STOP) / 0.35); }
    }
    [rpm, load, ov, cut, crank].forEach((val, k) => P[k].setValueAtTime(val, t));
  }
  await new Promise((r) => setTimeout(r, 50));
  const buf = await ctx.startRendering();
  await fetch(`/save?name=${id}-perdun.wav`, { method: 'POST', body: encodeWav(buf) });
  let peak = 0; for (let c = 0; c < 2; c++) for (const x of buf.getChannelData(c)) peak = Math.max(peak, Math.abs(x));
  log(`${id}: ${dur.toFixed(1)} с, пік ${peak.toFixed(2)}, перемикань ${drops.length} → збережено`);
}

for (const id of ['v8-muscle', 'v8-blower', 'flat6-gt', 'v12-super']) {
  try { await renderCar(id); } catch (err) { log(id + ': ПОМИЛКА ' + err.message); }
}
window.__done = true;
</script>
</body></html>
