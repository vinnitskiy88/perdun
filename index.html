<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<title>Пердун — звук двигуна для електромобіля</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">◉</span> Пердун</div>
  <div class="chips">
    <span id="chipGps" class="chip">GPS вимк.</span>
    <span id="chipEngine" class="chip">Двигун вимк.</span>
  </div>
</header>

<main class="layout">
  <section class="panel gauge-panel">
    <canvas id="tacho" aria-label="Тахометр"></canvas>
    <div class="readout">
      <div id="speed" class="speed">0</div>
      <div class="unit">км/год</div>
      <div class="gear-row"><span id="gear" class="gear">N</span><span id="rpm" class="rpm">0 об/хв</span></div>
    </div>
    <div class="throttle"><span>Газ</span><div class="bar"><i id="thrBar"></i></div></div>
  </section>

  <section class="panel side">
    <div id="secureWarn" class="notice warn" hidden>
      Сторінку відкрито не через HTTPS. Браузер не дасть ні звук через AudioWorklet, ні GPS.
      Відкрийте через https:// або localhost.
    </div>

    <button id="btnStart" class="start">Запустити двигун</button>

    <div class="seg" role="tablist">
      <button id="modeGps" class="seg-btn" data-mode="gps">GPS-їзда</button>
      <button id="modeTest" class="seg-btn" data-mode="test">Тест-драйв</button>
    </div>

    <div id="gpsInfo" class="notice" hidden>
      Звук залежить від швидкості з GPS. Дозвольте доступ до геолокації, коли браузер спитає.
      <div id="gpsStatus" class="muted">Очікування…</div>
    </div>

    <div id="pedals" class="pedals" hidden>
      <button id="pedBrake" class="pedal brake">Гальмо<small>↓ / S</small></button>
      <button id="pedGas" class="pedal gas">Газ<small>↑ / W / пробіл</small></button>
    </div>

    <h2>Двигун</h2>
    <div id="cars" class="cars"></div>

    <div class="sliders">
      <label>Гучність <output id="volOut">80%</output>
        <input id="vol" type="range" min="0" max="100" value="80">
      </label>
      <label>Постріли у вихлоп <output id="crkOut">100%</output>
        <input id="crk" type="range" min="0" max="100" value="100">
      </label>
    </div>
  </section>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
